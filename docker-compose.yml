services:
  # Объектное хранилище изображений и коротких видео для карточек топлива.
  heat-minio:
    image: minio/minio:latest
    container_name: heat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API, отсюда шаблоны берут изображения и видео
      - "9001:9001"   # веб-консоль Minio
    volumes:
      - heat-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Разовая инициализация: создаёт бакет, открывает его на чтение
  # и заливает файлы из resources/media.
  heat-minio-init:
    image: minio/mc:latest
    container_name: heat-minio-init
    depends_on:
      heat-minio:
        condition: service_healthy
    volumes:
      - ./resources/media:/media:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set heat http://heat-minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing heat/heat-fuel-media;
      mc anonymous set download heat/heat-fuel-media;
      mc cp --recursive /media/ heat/heat-fuel-media/;
      mc ls heat/heat-fuel-media;
      "

volumes:
  heat-minio-data:
